{% if success %}
  <div class="bg-green-900/30 border border-green-600 p-3 rounded-md">
    <p class="text-green-400 text-sm">{{ message }}</p>
  </div>
{% else %}
  <div class="bg-red-900/30 border border-red-600 p-3 rounded-md">
    <p class="text-red-400 text-sm">{{ message }}</p>
  </div>
{% endif %}
