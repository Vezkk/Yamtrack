{% if success %}
  <div class="dl-status-success bg-green-900/30 border border-green-600/50 p-3 rounded-md flex items-center gap-2.5"
       style="animation: dl-slide-in 0.3s ease-out both"
       x-data="{ show: true }"
       x-init="setTimeout(() => { show = false }, 5000)"
       x-show="show"
       x-transition:leave="transition ease-in duration-300"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0">
    <svg class="w-5 h-5 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <p class="text-green-300 text-sm">{{ message }}</p>
  </div>
{% else %}
  <div class="dl-status-error bg-red-900/30 border border-red-600/50 p-3 rounded-md flex items-center gap-2.5"
       style="animation: dl-slide-in 0.3s ease-out both">
    <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
    <p class="text-red-300 text-sm">{{ message }}</p>
  </div>
{% endif %}
